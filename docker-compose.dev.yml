# =============================================================================
# Docker Compose Development Override
# =============================================================================
# This file extends docker-compose.yml with development-specific settings
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

version: '3.8'

services:
  # PostgreSQL - Development settings
  postgres:
    ports:
      - "5432:5432"  # Expose for local database tools
    environment:
      POSTGRES_DB: propertymgmt_dev
    volumes:
      # Use named volume instead of bind mount for better performance
      - postgres_dev_data:/var/lib/postgresql/data

  # Redis - Development settings
  redis:
    ports:
      - "6379:6379"  # Expose for local Redis tools
    command: redis-server --appendonly yes  # No password in dev for convenience

  # Backend - Development settings with hot reload
  backend:
    build:
      target: development  # Use development stage
    environment:
      APP_ENV: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      CORS_ORIGINS: "*"  # Allow all origins in development
      REDIS_URL: redis://redis:6379/0  # No password in dev
    volumes:
      # Mount source code for hot reload
      - ./backend:/app
      # Exclude these directories to avoid conflicts
      - /app/__pycache__
      - /app/.pytest_cache
      - /app/venv
    ports:
      - "8000:8000"  # Direct access to backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug

  # Celery Worker - Development settings
  celery-worker:
    build:
      target: development
    environment:
      APP_ENV: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/.pytest_cache
      - /app/venv
    command: watchmedo auto-restart --directory=/app --pattern=*.py --recursive -- celery -A app.celery_app worker --loglevel=debug --concurrency=2

  # Celery Beat - Development settings
  celery-beat:
    build:
      target: development
    environment:
      APP_ENV: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: celery -A app.celery_app beat --loglevel=debug

  # Frontend - Development settings with hot reload
  frontend:
    build:
      target: development  # Use development stage
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Enable Next.js debugging
      DEBUG: "*"
    volumes:
      # Mount source code for hot reload
      - ./frontend:/app
      # Exclude node_modules to avoid conflicts
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"  # Direct access to frontend
    command: npm run dev

  # Nginx - Development settings
  nginx:
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    # In development, you might want to access services directly
    # so nginx is optional

# Development volumes
volumes:
  postgres_dev_data:
    driver: local

# Note: In development, you can also run services individually:
# - Backend: cd backend && uvicorn app.main:app --reload
# - Frontend: cd frontend && npm run dev
# - Celery: cd backend && celery -A app.celery_app worker --loglevel=info

